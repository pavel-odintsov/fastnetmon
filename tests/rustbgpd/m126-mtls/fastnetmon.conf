# FastNetMon Community configuration for M126. Options left out keep the
# binary's defaults.

logging_level = info
# No usage reports from the lab.
disable_usage_report = on

# Detection: incoming packets per second on the mirror interface.
enable_ban = on
enable_ban_ipv6 = on
process_incoming_traffic = on
process_outgoing_traffic = off
networks_list_path = /etc/networks_list
white_list_path = /etc/networks_whitelist
check_period = 1
average_calculation_time = 5
enable_connection_tracking = off
ban_for_pps = on
ban_for_bandwidth = off
ban_for_flows = off
threshold_pps = 1000

# A short ban, kept alive while the replay runs. The unban watchdog wakes
# every ban_time / 2 seconds.
ban_time = 20
unban_only_if_attack_finished = on

mirror_afpacket = on
interfaces = fnmmirror1

gobgp = off
rustbgpd = on
rustbgpd_target = rustbgpd:50051
rustbgpd_tls_ca_file = /certs/ca.pem
rustbgpd_tls_cert_file = /certs/client.pem
rustbgpd_tls_key_file = /certs/client.key
rustbgpd_announce_host = on
rustbgpd_announce_host_ipv6 = on
rustbgpd_announce_whole_subnet = off
rustbgpd_community_host = 65535:666
rustbgpd_community_host_ipv6 = 65535:666

enable_api = off
prometheus = off
